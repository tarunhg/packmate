<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Trips" />
  <title>Trips — Smart Packing Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              bg: '#F2F2F7',
              card: '#FFFFFF',
              darkBg: '#000000',
              darkCard: '#1C1C1E',
              darkElevated: '#2C2C2E',
              blue: '#007AFF',
              green: '#34C759',
              orange: '#FF9500',
              red: '#FF3B30',
              gray: '#8E8E93',
              separator: 'rgba(60, 60, 67, 0.12)',
              darkSeparator: 'rgba(84, 84, 88, 0.45)'
            }
          }
        }
      }
    };
  </script>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Translucent iOS Glass Material */
    .ios-glass {
      background: rgba(242, 242, 247, 0.82);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }
    .dark .ios-glass {
      background: rgba(28, 28, 30, 0.82);
    }

    .ios-sheet-glass {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
    }
    .dark .ios-sheet-glass {
      background: rgba(28, 28, 30, 0.94);
    }

    /* Hairline Borders */
    .hairline-b {
      border-bottom: 0.5px solid rgba(60, 60, 67, 0.14);
    }
    .dark .hairline-b {
      border-bottom: 0.5px solid rgba(84, 84, 88, 0.45);
    }

    .hairline-t {
      border-top: 0.5px solid rgba(60, 60, 67, 0.14);
    }
    .dark .hairline-t {
      border-top: 0.5px solid rgba(84, 84, 88, 0.45);
    }

    /* Spring Animations */
    .spring-transition {
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-ring-circle {
      transition: stroke-dashoffset 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* Hide Scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#E5E5EA] dark:bg-[#000000] text-[#000000] dark:text-[#FFFFFF] min-h-screen flex justify-center">

  <!-- Mobile-First App Shell -->
  <div id="app-shell" class="w-full max-w-[460px] min-h-screen bg-ios-bg dark:bg-ios-darkBg relative flex flex-col shadow-2xl overflow-x-hidden">

    <!-- ================= SCREEN 1: MY TRIPS VAULT ================= -->
    <div id="screen-trips" class="flex-1 flex flex-col pb-28">
      <!-- Top Bar -->
      <header class="sticky top-0 z-20 ios-glass hairline-b px-5 pt-4 pb-3 flex items-center justify-between">
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-wider text-ios-gray">Smart Travel Vault</p>
          <h1 class="text-[28px] font-bold tracking-tight leading-tight">My Trips</h1>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="toggleTheme()" class="w-9 h-9 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-gray-700 dark:text-gray-200 active:scale-95 spring-transition" title="Toggle Dark Mode">
            <span id="theme-icon-vault"></span>
          </button>
          <button onclick="openNewTripSheet()" class="h-9 px-3.5 rounded-full bg-ios-blue text-white text-[14px] font-semibold flex items-center gap-1.5 shadow-sm active:scale-95 spring-transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
            <span>New Trip</span>
          </button>
        </div>
      </header>

      <!-- Trips Content -->
      <main class="px-4 pt-5 space-y-6 flex-1">
        <!-- Active & Upcoming Section -->
        <section>
          <div class="flex items-center justify-between px-1 mb-2.5">
            <h2 class="text-[13px] font-semibold uppercase tracking-wider text-ios-gray">Active & Upcoming</h2>
            <span id="active-trips-count" class="text-[12px] font-medium text-ios-gray tabular-nums"></span>
          </div>
          <div id="active-trips-list" class="space-y-3"></div>
        </section>

        <!-- Past & Archived Section -->
        <section>
          <div class="flex items-center justify-between px-1 mb-2.5">
            <h2 class="text-[13px] font-semibold uppercase tracking-wider text-ios-gray">Past & Archived Checklists</h2>
            <span id="archived-trips-count" class="text-[12px] font-medium text-ios-gray tabular-nums"></span>
          </div>
          <div id="archived-trips-list" class="space-y-2.5"></div>
        </section>
      </main>
    </div>

    <!-- ================= SCREEN 2: ACTIVE TRIP CHECKLIST ================= -->
    <div id="screen-checklist" class="hidden flex-1 flex flex-col pb-28">
      <!-- Sticky Top Nav -->
      <header class="sticky top-0 z-20 ios-glass hairline-b px-3 pt-3 pb-2.5">
        <div class="flex items-center justify-between">
          <button onclick="showTripsScreen()" class="flex items-center gap-0.5 text-ios-blue text-[16px] font-medium py-1 px-1.5 rounded-lg active:opacity-60">
            <svg class="w-5 h-5 -ml-1" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
            <span>My Trips</span>
          </button>

          <div class="flex items-center gap-1.5">
            <button onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-gray-700 dark:text-gray-200 active:scale-95 spring-transition">
              <span id="theme-icon-detail"></span>
            </button>
            <button onclick="openTripOptionsSheet()" class="w-8 h-8 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-ios-blue active:scale-95 spring-transition" title="Trip Options">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Checklist Body -->
      <main class="px-4 pt-4 space-y-4 flex-1">
        <!-- Hero Progress Card -->
        <div class="bg-ios-card dark:bg-ios-darkCard rounded-2xl p-4 shadow-sm border border-black/[0.04] dark:border-white/[0.06]">
          <div class="flex items-center justify-between gap-4">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <span id="detail-trip-icon" class="w-7 h-7 rounded-lg bg-ios-blue/10 dark:bg-ios-blue/20 text-ios-blue flex items-center justify-center shrink-0"></span>
                <span id="detail-trip-dates" class="text-[12px] font-medium text-ios-gray truncate"></span>
              </div>
              <h1 id="detail-trip-title" class="text-[22px] font-bold tracking-tight mt-1 truncate"></h1>
              <p id="detail-status-text" class="text-[13px] text-ios-gray mt-0.5 tabular-nums"></p>
            </div>

            <!-- Activity Ring -->
            <div class="relative w-16 h-16 flex items-center justify-center shrink-0">
              <svg class="w-16 h-16" viewBox="0 0 64 64">
                <circle class="text-black/[0.06] dark:text-white/[0.1]" stroke="currentColor" stroke-width="6" fill="transparent" r="26" cx="32" cy="32"/>
                <circle id="detail-progress-ring" class="progress-ring-circle text-ios-blue" stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="transparent" r="26" cx="32" cy="32" stroke-dasharray="163.36" stroke-dashoffset="163.36"/>
              </svg>
              <span id="detail-progress-pct" class="absolute text-[14px] font-bold tabular-nums">0%</span>
            </div>
          </div>

          <!-- Smart Context Weather & Duration Pill -->
          <div id="detail-smart-badge" class="mt-3 pt-3 hairline-t flex items-center justify-between text-[12px] text-ios-gray">
            <span id="detail-smart-text" class="truncate font-medium">Smart Context Active</span>
            <button onclick="toggleLaundryMode()" id="detail-laundry-btn" class="shrink-0 ml-2 px-2.5 py-1 rounded-full bg-black/[0.05] dark:bg-white/[0.08] font-semibold text-ios-blue active:scale-95 spring-transition">
              Laundry: Off
            </button>
          </div>

          <!-- Linear Completion Bar -->
          <div class="mt-3 h-2 w-full bg-black/[0.06] dark:bg-white/[0.08] rounded-full overflow-hidden">
            <div id="detail-progress-bar" class="h-full bg-ios-blue spring-transition rounded-full" style="width: 0%"></div>
          </div>
        </div>

        <!-- Search & Segmented Filter Control -->
        <div class="space-y-2.5">
          <div class="relative">
            <svg class="w-4 h-4 text-ios-gray absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
            <input id="search-input" oninput="handleSearch(this.value)" type="text" placeholder="Search items..." class="w-full h-9 pl-9 pr-8 rounded-xl bg-black/[0.06] dark:bg-ios-darkCard text-[14px] placeholder-ios-gray focus:outline-none focus:ring-2 focus:ring-ios-blue/40" />
            <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-ios-gray hover:text-gray-900 dark:hover:text-white">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd"/></svg>
            </button>
          </div>

          <!-- iOS Segmented Control -->
          <div class="grid grid-cols-3 p-0.5 rounded-xl bg-black/[0.07] dark:bg-ios-darkCard text-[13px] font-semibold">
            <button onclick="setFilter('all')" id="filter-all" class="py-1.5 rounded-[10px] spring-transition">All</button>
            <button onclick="setFilter('remaining')" id="filter-remaining" class="py-1.5 rounded-[10px] spring-transition">To Pack</button>
            <button onclick="setFilter('packed')" id="filter-packed" class="py-1.5 rounded-[10px] spring-transition">Packed</button>
          </div>
        </div>

        <!-- Categories Accordion Container -->
        <div id="categories-container" class="space-y-3.5 pb-6"></div>
      </main>

      <!-- Thumb-Zone Bottom Action Toolbar -->
      <div class="fixed bottom-0 w-full max-w-[460px] z-20 ios-glass hairline-t px-4 py-2.5 flex items-center justify-between">
        <button onclick="openAddItemSheet()" class="flex items-center gap-1.5 text-ios-blue font-semibold text-[15px] py-1.5 px-2 rounded-lg active:opacity-60">
          <span class="w-6 h-6 rounded-full bg-ios-blue text-white flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          </span>
          <span>New Item</span>
        </button>

        <div class="flex items-center gap-2">
          <button onclick="openPresetsSheet()" class="text-[13px] font-semibold text-gray-700 dark:text-gray-200 bg-black/[0.06] dark:bg-white/[0.1] px-3 py-1.5 rounded-full active:scale-95 spring-transition">
            + Presets
          </button>
          <button onclick="openNewCategorySheet()" class="text-[13px] font-semibold text-gray-700 dark:text-gray-200 bg-black/[0.06] dark:bg-white/[0.1] px-3 py-1.5 rounded-full active:scale-95 spring-transition">
            + Category
          </button>
        </div>
      </div>
    </div>

    <!-- ================= MODALS & BOTTOM SHEETS ================= -->
    <div id="sheet-backdrop" onclick="closeAllSheets()" class="hidden fixed inset-0 bg-black/40 backdrop-blur-[2px] z-40 transition-opacity"></div>

    <!-- 1. New Trip Sheet (Smart Hybrid Engine) -->
    <div id="sheet-new-trip" class="hidden fixed bottom-0 w-full max-w-[460px] z-50 ios-sheet-glass rounded-t-3xl p-5 shadow-2xl border-t border-white/20 max-h-[88vh] overflow-y-auto">
      <div class="w-10 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
      <div class="flex items-center justify-between mb-4">
        <button onclick="closeAllSheets()" class="text-ios-blue text-[15px] font-medium">Cancel</button>
        <h3 class="text-[17px] font-bold">New Smart Trip</h3>
        <button onclick="createNewTrip()" class="text-ios-blue text-[15px] font-bold">Create</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Destination City or Region</label>
          <input id="new-trip-destination" type="text" placeholder="e.g., Tokyo, Reykjavik, Paris, Bali" class="w-full h-11 px-3.5 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[15px] focus:outline-none focus:ring-2 focus:ring-ios-blue" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Start Date</label>
            <input id="new-trip-start" type="date" class="w-full h-11 px-3 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[14px] focus:outline-none focus:ring-2 focus:ring-ios-blue tabular-nums" />
          </div>
          <div>
            <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">End Date</label>
            <input id="new-trip-end" type="date" class="w-full h-11 px-3 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[14px] focus:outline-none focus:ring-2 focus:ring-ios-blue tabular-nums" />
          </div>
        </div>

        <div>
          <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Trip Icon</label>
          <div id="new-trip-icons" class="grid grid-cols-6 gap-2"></div>
        </div>

        <div>
          <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Extra Pack Profile</label>
          <select id="new-trip-profile" class="w-full h-11 px-3.5 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[15px] focus:outline-none focus:ring-2 focus:ring-ios-blue">
            <option value="standard">Standard Holiday / Leisure</option>
            <option value="business">Business & Conference</option>
            <option value="photography">Photography & Content Creator</option>
            <option value="family">Family & Kids</option>
            <option value="longhaul">International Long-Haul Flight</option>
            <option value="blank">Blank Checklist (No Presets)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 2. Add Item Sheet -->
    <div id="sheet-add-item" class="hidden fixed bottom-0 w-full max-w-[460px] z-50 ios-sheet-glass rounded-t-3xl p-5 shadow-2xl border-t border-white/20">
      <div class="w-10 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
      <div class="flex items-center justify-between mb-4">
        <button onclick="closeAllSheets()" class="text-ios-blue text-[15px] font-medium">Cancel</button>
        <h3 class="text-[17px] font-bold">Add Packing Item</h3>
        <button onclick="submitNewItemSheet()" class="text-ios-blue text-[15px] font-bold">Add</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Item Name</label>
          <input id="sheet-item-name" type="text" placeholder="e.g., Noise-Canceling Headphones" class="w-full h-11 px-3.5 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[15px] focus:outline-none focus:ring-2 focus:ring-ios-blue" />
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Category</label>
            <select id="sheet-item-category" class="w-full h-11 px-3 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[14px] focus:outline-none"></select>
          </div>
          <div>
            <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Quantity</label>
            <input id="sheet-item-qty" type="number" min="1" max="99" value="1" class="w-full h-11 px-3 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[15px] text-center font-semibold tabular-nums focus:outline-none" />
          </div>
        </div>
      </div>
    </div>

    <!-- 3. New Category Sheet -->
    <div id="sheet-new-category" class="hidden fixed bottom-0 w-full max-w-[460px] z-50 ios-sheet-glass rounded-t-3xl p-5 shadow-2xl border-t border-white/20">
      <div class="w-10 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
      <div class="flex items-center justify-between mb-4">
        <button onclick="closeAllSheets()" class="text-ios-blue text-[15px] font-medium">Cancel</button>
        <h3 class="text-[17px] font-bold">New Category</h3>
        <button onclick="submitNewCategory()" class="text-ios-blue text-[15px] font-bold">Save</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Category Title</label>
          <input id="new-cat-title" type="text" placeholder="e.g., Pet Care, Fitness, Baby Gear" class="w-full h-11 px-3.5 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[15px] focus:outline-none focus:ring-2 focus:ring-ios-blue" />
        </div>
        <div>
          <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Quick Suggestions</label>
          <div class="flex flex-wrap gap-1.5">
            <button onclick="fillCatSuggestion('Pre-Flight Tasks', 'airplane')" class="text-[12px] px-2.5 py-1 rounded-full bg-black/[0.06] dark:bg-white/[0.1]">Pre-Flight Tasks</button>
            <button onclick="fillCatSuggestion('Pet & House Sitter', 'paw')" class="text-[12px] px-2.5 py-1 rounded-full bg-black/[0.06] dark:bg-white/[0.1]">Pet Sitter</button>
            <button onclick="fillCatSuggestion('Camera & Drone', 'camera')" class="text-[12px] px-2.5 py-1 rounded-full bg-black/[0.06] dark:bg-white/[0.1]">Camera Gear</button>
            <button onclick="fillCatSuggestion('Roadtrip Checks', 'car')" class="text-[12px] px-2.5 py-1 rounded-full bg-black/[0.06] dark:bg-white/[0.1]">Roadtrip Checks</button>
          </div>
        </div>
        <div>
          <label class="block text-[12px] font-semibold uppercase tracking-wider text-ios-gray mb-1.5">Symbol</label>
          <div id="new-cat-icons" class="grid grid-cols-6 gap-2"></div>
        </div>
      </div>
    </div>

    <!-- 4. Quick Presets Sheet -->
    <div id="sheet-presets" class="hidden fixed bottom-0 w-full max-w-[460px] z-50 ios-sheet-glass rounded-t-3xl p-5 shadow-2xl border-t border-white/20 max-h-[85vh] overflow-y-auto">
      <div class="w-10 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-[17px] font-bold">Expanded Preset Packs</h3>
        <button onclick="closeAllSheets()" class="text-ios-blue text-[15px] font-semibold">Done</button>
      </div>
      <p class="text-[13px] text-ios-gray mb-4">Tap any specialty pack to append its smart items into your current trip.</p>
      <div id="presets-list" class="space-y-2.5"></div>
    </div>

    <!-- 5. Trip Options Action Sheet -->
    <div id="sheet-trip-options" class="hidden fixed bottom-0 w-full max-w-[460px] z-50 ios-sheet-glass rounded-t-3xl p-5 shadow-2xl border-t border-white/20">
      <div class="w-10 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
      <h3 id="options-trip-title" class="text-[15px] font-bold text-center text-ios-gray mb-4 truncate">Trip Options</h3>
      <div class="space-y-2">
        <button onclick="uncheckAllCurrentTrip()" class="w-full py-3 px-4 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[15px] font-medium text-left flex items-center justify-between">
          <span>Unpack All Items (Reset Progress)</span>
          <svg class="w-5 h-5 text-ios-gray" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
        </button>
        <button onclick="duplicateCurrentTrip()" class="w-full py-3 px-4 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-[15px] font-medium text-left flex items-center justify-between">
          <span>Duplicate Checklist for Future Trip</span>

    function getOfflineClimateAndPlug(destination) {
      const q = (destination || '').toLowerCase();
      let climate = 'mild';
      let plug = 'EU';

      if (q.includes('tokyo') || q.includes('japan') || q.includes('usa') || q.includes('america') || q.includes('new york') || q.includes('canada')) {
        plug = 'US';
      } else if (q.includes('london') || q.includes('uk') || q.includes('england') || q.includes('scotland')) {
        plug = 'UK';
      }

      if (q.includes('iceland') || q.includes('alps') || q.includes('switzerland') || q.includes('oslo') || q.includes('norway') || q.includes('canada')) {
        climate = 'cold';
      } else if (q.includes('bali') || q.includes('bangkok') || q.includes('dubai') || q.includes('maldives') || q.includes('hawaii') || q.includes('miami')) {
        climate = 'hot';
      }

      return { climate, plugType: plug };
    }

    async function resolveDestinationWeather(destination, startDateStr, endDateStr) {
      const fallback = getOfflineClimateAndPlug(destination);
      let nights = 5;
      if (startDateStr && endDateStr) {
        const d1 = new Date(startDateStr);
        const d2 = new Date(endDateStr);
        const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
        if (diff > 0) nights = diff;
      }

      if (!navigator.onLine || !destination.trim()) {
        return { nights, climate: fallback.climate, plugType: fallback.plugType, summary: `${nights} Nights • Offline Fallback` };
      }

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(destination)}&count=1`, { signal: controller.signal });
        clearTimeout(timeoutId);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          return { nights, climate: fallback.climate, plugType: fallback.plugType, summary: `${nights} Nights • ${destination}` };
        }

        const loc = geoData.results[0];
        const lat = loc.latitude;
        const lon = loc.longitude;
        const countryCode = loc.country_code ? loc.country_code.toUpperCase() : '';

        let plug = fallback.plugType;
        if (['US', 'CA', 'JP', 'MX', 'TW'].includes(countryCode)) plug = 'US';
        else if (['GB', 'IE', 'CY', 'MT', 'HK', 'SG'].includes(countryCode)) plug = 'UK';
        else if (['FR', 'DE', 'ES', 'IT', 'NL', 'PT', 'GR', 'AT', 'BE'].includes(countryCode)) plug = 'EU';

        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max&timezone=auto`);
        const weatherData = await weatherRes.json();

        let avgTemp = 20;
        if (weatherData.daily && weatherData.daily.temperature_2m_max && weatherData.daily.temperature_2m_max.length > 0) {
          const temps = weatherData.daily.temperature_2m_max.filter(t => t != null);
          if (temps.length > 0) {
            avgTemp = temps.reduce((a, b) => a + b, 0) / temps.length;
          }
        }

        let climate = 'mild';
        if (avgTemp < 12) climate = 'cold';
        else if (avgTemp > 24) climate = 'hot';

        return {
          nights,
          climate,
          plugType: plug,
          summary: `${nights} Nights • ~${Math.round(avgTemp)}°C Live Weather`
        };
      } catch (e) {
        return { nights, climate: fallback.climate, plugType: fallback.plugType, summary: `${nights} Nights • ${destination}` };
      }
    }

    const DEFAULT_TRIPS = [
      {
        id: 'trip-kyoto',
        name: "Kyoto & Tokyo '26",
        dates: '10 Nights • ~14°C Live Weather',
        destination: 'Kyoto',
        laundryMode: false,
        icon: 'airplane',
        archived: false,
        categories: generateSmartCategories(10, 'cold', 'US', 'standard')
      }
    ];

    const STORAGE_KEY = 'apple_trips_vault_v3';
    const THEME_KEY = 'apple_trips_theme_v3';

    let state = {
      trips: [],
      currentTripId: null,
      filter: 'all',
      search: '',
      selectedNewTripIcon: 'airplane',
      selectedNewCatIcon: 'sparkles'
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.trips) && parsed.trips.length > 0) {
            state.trips = parsed.trips;
          } else {
            state.trips = JSON.parse(JSON.stringify(DEFAULT_TRIPS));
          }
        } else {
          state.trips = JSON.parse(JSON.stringify(DEFAULT_TRIPS));
        }
      } catch (e) {
        state.trips = JSON.parse(JSON.stringify(DEFAULT_TRIPS));
      }

      const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
      document.documentElement.classList.toggle('dark', savedTheme === 'dark');
      updateThemeIcons();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ trips: state.trips }));
    }

    function getCurrentTrip() {
      return state.trips.find(t => t.id === state.currentTripId) || null;
    }

    function getTripStats(trip) {
      let total = 0;
      let packed = 0;
      trip.categories.forEach(c => {
        c.items.forEach(item => {
          total += 1;
          if (item.packed) packed += 1;
        });
      });
      const pct = total === 0 ? 0 : Math.round((packed / total) * 100);
      return { total, packed, pct };
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      updateThemeIcons();
    }

    function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      const svg = isDark ? ICONS.sun : ICONS.moon;
      const v1 = document.getElementById('theme-icon-vault');
      const v2 = document.getElementById('theme-icon-detail');
      if (v1) v1.innerHTML = svg;
      if (v2) v2.innerHTML = svg;
    }

    function openTrip(tripId) {
      state.currentTripId = tripId;
      state.filter = 'all';
      state.search = '';
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      document.getElementById('screen-trips').classList.add('hidden');
      document.getElementById('screen-checklist').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'instant' });
      renderChecklistScreen();
    }

    function showTripsScreen() {
      state.currentTripId = null;
      document.getElementById('screen-checklist').classList.add('hidden');
      document.getElementById('screen-trips').classList.remove('hidden');
      renderTripsVault();
    }

    function renderTripsVault() {
      const activeList = document.getElementById('active-trips-list');
      const archivedList = document.getElementById('archived-trips-list');

      const activeTrips = state.trips.filter(t => !t.archived);
      const archivedTrips = state.trips.filter(t => t.archived);

      document.getElementById('active-trips-count').textContent = `${activeTrips.length}`;
      document.getElementById('archived-trips-count').textContent = `${archivedTrips.length}`;

      if (activeTrips.length === 0) {
        activeList.innerHTML = `
          <div class="bg-ios-card dark:bg-ios-darkCard rounded-2xl p-6 text-center border border-black/[0.04] dark:border-white/[0.06]">
            <p class="text-[15px] font-semibold">No Active Trips</p>
            <p class="text-[13px] text-ios-gray mt-1">Tap "+ New Trip" above or duplicate a past checklist below to start packing.</p>
          </div>
        `;
      } else {
        activeList.innerHTML = activeTrips.map(trip => {
          const { total, packed, pct } = getTripStats(trip);
          const barColor = pct === 100 ? 'bg-ios-green' : 'bg-ios-blue';
          const badge = pct === 100
            ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-ios-green/15 text-ios-green">Ready</span>`
            : `<span class="text-[12px] font-bold tabular-nums text-ios-blue">${pct}%</span>`;

          return `
            <div onclick="openTrip('${trip.id}')" class="bg-ios-card dark:bg-ios-darkCard rounded-2xl p-4 shadow-sm border border-black/[0.04] dark:border-white/[0.06] active:scale-[0.99] spring-transition cursor-pointer">
              <div class="flex items-start justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-10 h-10 rounded-xl bg-ios-blue/10 dark:bg-ios-blue/20 text-ios-blue flex items-center justify-center shrink-0">
                    ${ICONS[trip.icon] || ICONS.airplane}
                  </div>
                  <div class="min-w-0">
                    <h3 class="text-[17px] font-bold tracking-tight truncate">${escapeHtml(trip.name)}</h3>
                    <p class="text-[12px] text-ios-gray truncate">${escapeHtml(trip.dates || 'Upcoming Trip')}</p>
                  </div>
                </div>
                ${badge}
              </div>

              <div class="mt-3.5 h-1.5 w-full bg-black/[0.06] dark:bg-white/[0.08] rounded-full overflow-hidden">
                <div class="h-full ${barColor} spring-transition rounded-full" style="width: ${pct}%"></div>
              </div>

              <div class="mt-2.5 flex items-center justify-between text-[12px] text-ios-gray">
                <span class="tabular-nums">${packed} of ${total} items packed</span>
                <span class="text-ios-blue font-medium flex items-center gap-0.5">
                  Open
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
                </span>
              </div>
            </div>
          `;
        }).join('');
      }

      if (archivedTrips.length === 0) {
        archivedList.innerHTML = `
          <div class="rounded-2xl p-4 text-center text-[13px] text-ios-gray border border-dashed border-black/10 dark:border-white/10">
            Completed trips you archive will appear here for easy reuse.
          </div>
        `;
      } else {
        archivedList.innerHTML = archivedTrips.map(trip => {
          const { total } = getTripStats(trip);
          return `
            <div class="bg-ios-card dark:bg-ios-darkCard rounded-2xl p-3.5 border border-black/[0.04] dark:border-white/[0.06] flex items-center justify-between gap-3">
              <div onclick="openTrip('${trip.id}')" class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer">
                <div class="w-9 h-9 rounded-xl bg-black/[0.05] dark:bg-white/[0.08] text-ios-gray flex items-center justify-center shrink-0">
                  ${ICONS[trip.icon] || ICONS.suitcase}
                </div>
                <div class="min-w-0">
                  <h4 class="text-[15px] font-semibold truncate">${escapeHtml(trip.name)}</h4>
                  <p class="text-[12px] text-ios-gray truncate tabular-nums">${total} items • ${escapeHtml(trip.dates || 'Archived')}</p>
                </div>
              </div>
              <button onclick="duplicateTripById('${trip.id}')" class="shrink-0 px-3 py-1.5 rounded-full bg-ios-blue/10 dark:bg-ios-blue/20 text-ios-blue text-[12px] font-semibold active:scale-95 spring-transition">
                Reuse List
              </button>
            </div>
          `;
        }).join('');
      }
    }

    function renderChecklistScreen() {
      const trip = getCurrentTrip();
      if (!trip) return showTripsScreen();

      const { total, packed, pct } = getTripStats(trip);
      document.getElementById('detail-trip-icon').innerHTML = ICONS[trip.icon] || ICONS.airplane;
      document.getElementById('detail-trip-dates').textContent = trip.dates || (trip.archived ? 'Archived Trip' : 'Active Checklist');
      document.getElementById('detail-trip-title').textContent = trip.name;

      document.getElementById('detail-smart-text').textContent = trip.dates || 'Smart Hybrid Engine Active';
      const laundryBtn = document.getElementById('detail-laundry-btn');
      laundryBtn.textContent = trip.laundryMode ? 'Laundry: On' : 'Laundry: Off';
      laundryBtn.className = trip.laundryMode
        ? 'shrink-0 ml-2 px-2.5 py-1 rounded-full bg-ios-blue text-white font-semibold text-[12px] active:scale-95 spring-transition'
        : 'shrink-0 ml-2 px-2.5 py-1 rounded-full bg-black/[0.05] dark:bg-white/[0.08] font-semibold text-ios-blue active:scale-95 spring-transition';

      let statusMsg = `${packed} of ${total} packed`;
      if (total > 0 && pct === 100) statusMsg = `All ${total} items packed • Ready for departure`;
      else if (total > 0 && total - packed <= 3) statusMsg = `Almost there • ${total - packed} left`;
      document.getElementById('detail-status-text').textContent = statusMsg;

      const circumference = 163.36;
      const offset = circumference - (pct / 100) * circumference;
      const ringEl = document.getElementById('detail-progress-ring');
      const barEl = document.getElementById('detail-progress-bar');

      ringEl.style.strokeDashoffset = offset;
      barEl.style.width = `${pct}%`;

      const isDone = pct === 100 && total > 0;
      ringEl.classList.toggle('text-ios-green', isDone);
      ringEl.classList.toggle('text-ios-blue', !isDone);
      barEl.classList.toggle('bg-ios-green', isDone);
      barEl.classList.toggle('bg-ios-blue', !isDone);

      document.getElementById('detail-progress-pct').textContent = `${pct}%`;

      ['all', 'remaining', 'packed'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (state.filter === f) {
          btn.className = 'py-1.5 rounded-[10px] bg-white dark:bg-ios-darkElevated shadow-sm text-black dark:text-white spring-transition';
        } else {
          btn.className = 'py-1.5 rounded-[10px] text-ios-gray spring-transition';
        }
      });

      const container = document.getElementById('categories-container');
      const query = state.search.trim().toLowerCase();

      const cardsHtml = trip.categories.map(cat => {
        const catTotal = cat.items.length;
        const catPacked = cat.items.filter(i => i.packed).length;
        const catDone = catTotal > 0 && catPacked === catTotal;

        const filteredItems = cat.items.filter(item => {
          if (state.filter === 'remaining' && item.packed) return false;
          if (state.filter === 'packed' && !item.packed) return false;
          if (query && !item.name.toLowerCase().includes(query)) return false;
          return true;
        });

        if ((query || state.filter !== 'all') && filteredItems.length === 0) {
          return '';
        }

        const rowsHtml = filteredItems.map((item, idx) => {
          const isLast = idx === filteredItems.length - 1;
          return `
            <div class="flex items-center justify-between pl-4 pr-3 py-2.5 ${!isLast ? 'hairline-b' : ''}">
              <button onclick="toggleItem('${cat.id}', '${item.id}')" class="flex items-center gap-3 flex-1 min-w-0 text-left py-0.5">
                <span class="w-[22px] h-[22px] rounded-full flex items-center justify-center shrink-0 spring-transition ${
                  item.packed
                    ? 'bg-ios-blue text-white border border-ios-blue'
                    : 'border-[1.8px] border-gray-300 dark:border-gray-600'
                }">
                  ${item.packed ? `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>` : ''}
                </span>
                <span class="text-[15px] truncate spring-transition ${item.packed ? 'line-through text-ios-gray' : 'font-medium'}">
                  ${escapeHtml(item.name)}
                </span>
              </button>

              <div class="flex items-center gap-1.5 shrink-0 ml-2">
                <div class="flex items-center bg-black/[0.04] dark:bg-white/[0.07] rounded-full px-1.5 py-0.5">
                  <button onclick="adjustQty('${cat.id}', '${item.id}', -1)" class="w-5 h-5 text-ios-gray hover:text-black dark:hover:text-white flex items-center justify-center text-[14px] font-bold">−</button>
                  <span class="text-[12px] font-semibold tabular-nums px-1 text-gray-700 dark:text-gray-300">${item.qty}</span>
                  <button onclick="adjustQty('${cat.id}', '${item.id}', 1)" class="w-5 h-5 text-ios-gray hover:text-black dark:hover:text-white flex items-center justify-center text-[14px] font-bold">+</button>
                </div>
                <button onclick="deleteItem('${cat.id}', '${item.id}')" class="w-6 h-6 rounded-full text-gray-300 hover:text-ios-red dark:text-gray-600 dark:hover:text-ios-red flex items-center justify-center" title="Remove item">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <section class="bg-ios-card dark:bg-ios-darkCard rounded-2xl shadow-sm border border-black/[0.04] dark:border-white/[0.06] overflow-hidden">
            <div class="px-4 py-3 flex items-center justify-between ${!cat.collapsed ? 'hairline-b' : ''}">
              <button onclick="toggleCategoryCollapse('${cat.id}')" class="flex items-center gap-2.5 flex-1 min-w-0 text-left">
                <span class="w-7 h-7 rounded-lg ${catDone ? 'bg-ios-green/15 text-ios-green' : 'bg-ios-blue/10 dark:bg-ios-blue/20 text-ios-blue'} flex items-center justify-center shrink-0">
                  ${ICONS[cat.icon] || ICONS.suitcase}
                </span>
                <span class="text-[15px] font-bold tracking-tight truncate">${escapeHtml(cat.title)}</span>
                <span class="text-[12px] font-semibold tabular-nums px-2 py-0.5 rounded-full ${catDone ? 'bg-ios-green/15 text-ios-green' : 'bg-black/[0.05] dark:bg-white/[0.08] text-ios-gray'}">
                  ${catPacked}/${catTotal}
                </span>
              </button>

              <div class="flex items-center gap-1">
                <button onclick="togglePackAllCategory('${cat.id}')" class="text-[12px] font-semibold text-ios-blue px-2 py-1 rounded-lg active:opacity-60">
                  ${catDone ? 'Unpack' : 'Pack All'}
                </button>
                <button onclick="toggleCategoryCollapse('${cat.id}')" class="p-1 text-ios-gray">
                  <svg class="w-4 h-4 spring-transition ${cat.collapsed ? '-rotate-90' : 'rotate-0'}" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                </button>
              </div>
            </div>

            <div class="${cat.collapsed ? 'hidden' : 'block'}">
              ${rowsHtml || `<p class="px-4 py-3 text-[13px] text-ios-gray">No items in this category yet.</p>`}
              <form onsubmit="handleInlineAdd(event, '${cat.id}')" class="flex items-center gap-2.5 pl-4 pr-3 py-2 hairline-t bg-black/[0.015] dark:bg-white/[0.02]">
                <span class="w-[22px] h-[22px] rounded-full flex items-center justify-center text-ios-blue">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                </span>
                <input type="text" placeholder="Add item to ${escapeHtml(cat.title)}..." class="flex-1 bg-transparent text-[14px] placeholder-ios-gray focus:outline-none py-1" />
                <button type="submit" class="text-[13px] font-semibold text-ios-blue px-2 py-0.5">Add</button>
              </form>
            </div>
          </section>
        `;
      }).join('');

      container.innerHTML = cardsHtml || `
        <div class="bg-ios-card dark:bg-ios-darkCard rounded-2xl p-8 text-center">
          <p class="text-[15px] font-semibold">No Matching Items</p>
          <p class="text-[13px] text-ios-gray mt-1">Try switching your filter or clearing the search bar.</p>
        </div>
      `;
    }

    function toggleItem(catId, itemId) {
      const trip = getCurrentTrip();
      if (!trip) return;
      const cat = trip.categories.find(c => c.id === catId);
      if (!cat) return;
      const item = cat.items.find(i => i.id === itemId);
      if (!item) return;
      item.packed = !item.packed;
      saveState();
      renderChecklistScreen();
    }

    function adjustQty(catId, itemId, delta) {
      const trip = getCurrentTrip();
      if (!trip) return;
      const cat = trip.categories.find(c => c.id === catId);
      if (!cat) return;
      const item = cat.items.find(i => i.id === itemId);
      if (!item) return;
      item.qty = Math.max(1, Math.min(99, item.qty + delta));
      saveState();
      renderChecklistScreen();
    }

    function deleteItem(catId, itemId) {
      const trip = getCurrentTrip();
      if (!trip) return;
      const cat = trip.categories.find(c => c.id === catId);
      if (!cat) return;
      cat.items = cat.items.filter(i => i.id !== itemId);
      saveState();
      renderChecklistScreen();
    }

    function handleInlineAdd(e, catId) {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const name = input.value.trim();
      if (!name) return;
      const trip = getCurrentTrip();
      const cat = trip.categories.find(c => c.id === catId);
      if (!cat) return;
      cat.items.push({
        id: 'item-' + Date.now(),
        name,
        qty: 1,
        packed: false
      });
      input.value = '';
      saveState();
      renderChecklistScreen();
    }

    function toggleCategoryCollapse(catId) {
      const trip = getCurrentTrip();
      const cat = trip.categories.find(c => c.id === catId);
      if (!cat) return;
      cat.collapsed = !cat.collapsed;
      saveState();
      renderChecklistScreen();
    }

    function togglePackAllCategory(catId) {
      const trip = getCurrentTrip();
      const cat = trip.categories.find(c => c.id === catId);
      if (!cat || cat.items.length === 0) return;
      const allPacked = cat.items.every(i => i.packed);
      cat.items.forEach(i => (i.packed = !allPacked));
      saveState();
      renderChecklistScreen();
    }

    function setFilter(f) {
      state.filter = f;
      renderChecklistScreen();
    }

    function handleSearch(val) {
      state.search = val;
      document.getElementById('clear-search-btn').classList.toggle('hidden', !val);
      renderChecklistScreen();
    }

    function clearSearch() {
      state.search = '';
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      renderChecklistScreen();
    }

    function toggleLaundryMode() {
      const trip = getCurrentTrip();
      if (!trip) return;
      trip.laundryMode = !trip.laundryMode;
      const cloCat = trip.categories.find(c => c.id === 'cat-clo' || c.title.toLowerCase().includes('clothing'));
      if (cloCat) {
        let nights = 5;
        const match = trip.dates.match(/(\d+)\s+Nights/);
        if (match) nights = parseInt(match[1], 10);

        const targetQty = trip.laundryMode ? Math.min(4, nights) : nights + 1;
        cloCat.items.forEach(item => {
          if (item.name.includes('Underwear') || item.name.includes('Socks') || item.name.includes('T-Shirts')) {
            item.qty = targetQty;
          }
        });
      }
      saveState();
      renderChecklistScreen();
    }

    function closeAllSheets() {
      document.getElementById('sheet-backdrop').classList.add('hidden');
      ['sheet-new-trip', 'sheet-add-item', 'sheet-new-category', 'sheet-presets', 'sheet-trip-options'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }

    function openNewTripSheet() {
      document.getElementById('new-trip-destination').value = '';
      const today = new Date();
      const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
      document.getElementById('new-trip-start').value = today.toISOString().split('T')[0];
      document.getElementById('new-trip-end').value = nextWeek.toISOString().split('T')[0];
      renderIconPicker('new-trip-icons', state.selectedNewTripIcon, 'selectNewTripIcon');

      document.getElementById('sheet-backdrop').classList.remove('hidden');
      document.getElementById('sheet-new-trip').classList.remove('hidden');
      setTimeout(() => document.getElementById('new-trip-destination').focus(), 80);
    }

    function selectNewTripIcon(iconKey) {
      state.selectedNewTripIcon = iconKey;
      renderIconPicker('new-trip-icons', iconKey, 'selectNewTripIcon');
    }

    async function createNewTrip() {
      const destInput = document.getElementById('new-trip-destination').value.trim() || 'Holiday';
      const startStr = document.getElementById('new-trip-start').value;
      const endStr = document.getElementById('new-trip-end').value;
      const profile = document.getElementById('new-trip-profile').value;

      const resolved = await resolveDestinationWeather(destInput, startStr, endStr);
      let categories = generateSmartCategories(resolved.nights, resolved.climate, resolved.plugType, profile);

      if (profile === 'blank') {
        categories = [{ id: 'cat-' + Date.now(), title: 'Essentials', icon: 'passport', collapsed: false, items: [] }];
      }

      const newTrip = {
        id: 'trip-' + Date.now(),
        name: `${destInput} Trip`,
        destination: destInput,
        dates: resolved.summary,
        laundryMode: false,
        icon: state.selectedNewTripIcon || 'airplane',
        archived: false,
        categories
      };

      state.trips.unshift(newTrip);
      saveState();
      closeAllSheets();
      openTrip(newTrip.id);
    }

    function duplicateTripById(tripId) {
      const source = state.trips.find(t => t.id === tripId);
      if (!source) return;
      const clonedCategories = JSON.parse(JSON.stringify(source.categories));
      clonedCategories.forEach(c => {
        c.collapsed = false;
        c.items.forEach(i => (i.packed = false));
      });
      const copyTrip = {
        id: 'trip-' + Date.now(),
        name: `${source.name} (Copy)`,
        destination: source.destination || 'Destination',
        dates: source.dates,
        laundryMode: false,
        icon: source.icon,
        archived: false,
        categories: clonedCategories
      };
      state.trips.unshift(copyTrip);
      saveState();
      closeAllSheets();
      openTrip(copyTrip.id);
    }

    function openAddItemSheet() {
      const trip = getCurrentTrip();
      if (!trip) return;
      document.getElementById('sheet-item-name').value = '';
      document.getElementById('sheet-item-qty').value = '1';
      const select = document.getElementById('sheet-item-category');
      select.innerHTML = trip.categories.map(c => `<option value="${c.id}">${escapeHtml(c.title)}</option>`).join('');

      document.getElementById('sheet-backdrop').classList.remove('hidden');
      document.getElementById('sheet-add-item').classList.remove('hidden');
      setTimeout(() => document.getElementById('sheet-item-name').focus(), 80);
    }

    function submitNewItemSheet() {
      const name = document.getElementById('sheet-item-name').value.trim();
      if (!name) return;
      const catId = document.getElementById('sheet-item-category').value;
      const qty = Math.max(1, parseInt(document.getElementById('sheet-item-qty').value, 10) || 1);

      const trip = getCurrentTrip();
      const cat = trip.categories.find(c => c.id === catId);
      if (!cat) return;
      cat.collapsed = false;
      cat.items.push({
        id: 'item-' + Date.now(),
        name,
        qty,
        packed: false
      });
      saveState();
      closeAllSheets();
      renderChecklistScreen();
    }

    function openNewCategorySheet() {
      document.getElementById('new-cat-title').value = '';
      renderIconPicker('new-cat-icons', state.selectedNewCatIcon, 'selectNewCatIcon');
      document.getElementById('sheet-backdrop').classList.remove('hidden');
      document.getElementById('sheet-new-category').classList.remove('hidden');
    }

    function selectNewCatIcon(iconKey) {
      state.selectedNewCatIcon = iconKey;
      renderIconPicker('new-cat-icons', iconKey, 'selectNewCatIcon');
    }

    function fillCatSuggestion(title, iconKey) {
      document.getElementById('new-cat-title').value = title;
      selectNewCatIcon(iconKey);
    }

    function submitNewCategory() {
      const title = document.getElementById('new-cat-title').value.trim();
      if (!title) return;
      const trip = getCurrentTrip();
      if (!trip) return;
      trip.categories.push({
        id: 'cat-' + Date.now(),
        title,
        icon: state.selectedNewCatIcon || 'suitcase',
        collapsed: false,
        items: []
      });
      saveState();
      closeAllSheets();
      renderChecklistScreen();
    }

    function openPresetsSheet() {
      const container = document.getElementById('presets-list');
      container.innerHTML = PRESET_PACKS.map(pack => `
        <button onclick="applyPresetPack('${pack.id}')" class="w-full p-3.5 rounded-2xl bg-black/[0.04] dark:bg-white/[0.07] flex items-center justify-between text-left active:scale-[0.99] spring-transition">
          <div class="flex items-center gap-3">
            <span class="w-9 h-9 rounded-xl bg-ios-blue/10 dark:bg-ios-blue/20 text-ios-blue flex items-center justify-center">
              ${ICONS[pack.icon] || ICONS.suitcase}
            </span>
            <div>
              <p class="text-[15px] font-semibold">${escapeHtml(pack.name)}</p>
              <p class="text-[12px] text-ios-gray">${pack.items.length} smart essentials</p>
            </div>
          </div>
          <span class="text-[13px] font-semibold text-ios-blue">+ Add</span>
        </button>
      `).join('');

      document.getElementById('sheet-backdrop').classList.remove('hidden');
      document.getElementById('sheet-presets').classList.remove('hidden');
    }

    function applyPresetPack(packId) {
      const pack = PRESET_PACKS.find(p => p.id === packId);
      const trip = getCurrentTrip();
      if (!pack || !trip) return;

      let cat = trip.categories.find(c => c.title.toLowerCase() === pack.categoryTitle.toLowerCase());
      if (!cat) {
        cat = {
          id: 'cat-' + Date.now(),
          title: pack.categoryTitle,
          icon: pack.icon,
          collapsed: false,
          items: []
        };
        trip.categories.push(cat);
      }
      cat.collapsed = false;
      const existingNames = new Set(cat.items.map(i => i.name.toLowerCase()));
      pack.items.forEach((itemName, idx) => {
        if (!existingNames.has(itemName.toLowerCase())) {
          cat.items.push({
            id: `preset-${Date.now()}-${idx}`,
            name: itemName,
            qty: 1,
            packed: false
          });
        }
      });

      saveState();
      closeAllSheets();
      renderChecklistScreen();
    }

    function openTripOptionsSheet() {
      const trip = getCurrentTrip();
      if (!trip) return;
      document.getElementById('options-trip-title').textContent = trip.name;
      const archiveBtn = document.getElementById('btn-toggle-archive');
      archiveBtn.querySelector('span').textContent = trip.archived
        ? 'Restore to Active & Upcoming Trips'
        : 'Archive Trip (Move to Past Trips)';

      document.getElementById('sheet-backdrop').classList.remove('hidden');
      document.getElementById('sheet-trip-options').classList.remove('hidden');
    }

    function uncheckAllCurrentTrip() {
      const trip = getCurrentTrip();
      if (!trip) return;
      trip.categories.forEach(c => c.items.forEach(i => (i.packed = false)));
      saveState();
      closeAllSheets();
      renderChecklistScreen();
    }

    function duplicateCurrentTrip() {
      const trip = getCurrentTrip();
      if (!trip) return;
      duplicateTripById(trip.id);
    }

    function toggleArchiveCurrentTrip() {
      const trip = getCurrentTrip();
      if (!trip) return;
      trip.archived = !trip.archived;
      saveState();
      closeAllSheets();
      showTripsScreen();
    }

    function deleteCurrentTrip() {
      const trip = getCurrentTrip();
      if (!trip) return;
      state.trips = state.trips.filter(t => t.id !== trip.id);
      saveState();
      closeAllSheets();
      showTripsScreen();
    }

    function renderIconPicker(containerId, selectedKey, handlerName) {
      const keys = ['airplane', 'sun', 'snow', 'mountain', 'suitcase', 'passport', 'tshirt', 'bolt', 'sparkles', 'shield', 'camera', 'car', 'briefcase', 'heart'];
      document.getElementById(containerId).innerHTML = keys.map(k => `
        <button type="button" onclick="${handlerName}('${k}')" class="h-10 rounded-xl flex items-center justify-center spring-transition ${
          selectedKey === k
            ? 'bg-ios-blue text-white shadow-sm'
            : 'bg-black/[0.05] dark:bg-white/[0.08] text-gray-700 dark:text-gray-300'
        }">
          ${ICONS[k]}
        </button>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Boot App safely on load
    try {
      loadState();
      renderTripsVault();
    } catch (e) {
      console.error('App init error:', e);
    }
  </script>
</body>
</html>
